<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta property="og:title" content="foodos · lula recheada × camarão">
<meta property="og:description" content="трекер готовки в стиле shaper: камера, голос, живые ингредиенты через openrouter. морская + растительная дорожки.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=1">
</head>
<body>

      <path d="M62,16 C70,18 70,28 64,30" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="44" cy="40" r="2.4" fill="currentColor"/>

      <circle cx="74" cy="22" r="6.5" fill="currentColor"/>

      <path d="M64,50 C70,52 74,56 72,62 C70,58 67,57 64,57" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>

<div class="wrap">

  <header class="top">
    <div class="brand"><span class="dot"></span>foodos</div>
    <div class="crumb" id="crumb">fig.01</div>
    <div class="ctl">
      <button class="chip" id="voiceChip" onclick="toggleVoice()">voice · <span class="k">off</span></button>
      <button class="chip" id="camChip" onclick="toggleCam()">cam · <span class="k">off</span></button>
      <button class="chip" id="themeChip" onclick="toggleTheme()">theme · <span class="k">light</span></button>
    </div>
  </header>

  <div class="stats">
    <div class="cell"><div class="v" id="stServ">–</div><div class="l">порций</div></div>
    <div class="cell"><div class="v" id="stActive">–</div><div class="l">актив. время</div></div>
    <div class="cell"><div class="v" id="stTotal">–</div><div class="l">всего</div></div>
    <div class="cell"><div class="v num" id="stDone">0/0</div><div class="l">шагов</div></div>
  </div>
  <div class="progline"><div class="fill" id="progfill" style="right:100%"></div></div>

  <div class="layout">

    <!-- instrument column -->
    <div class="col-panel">
      <div class="panel-sec">
        <div class="hd"><span class="t">camera · monitor</span><span class="g">◉</span></div>
        <div class="bd">
          <div class="cam" id="cam">
            <video id="camVideo" playsinline muted></video>
            <span class="reg tl"></span><span class="reg tr"></span><span class="reg bl"></span><span class="reg br"></span>
            <span class="idle">cam · off<br>наведи на сковороду</span>
            <span class="tag">input · b/w · 1:1</span>
          </div>
          <div class="cam-ctl">
            <button class="chip" onclick="toggleCam()">вкл / выкл</button>
            <button class="chip" onclick="checkByCamera()">проверить</button>
          </div>
        </div>
      </div>

      <div class="panel-sec">
        <div class="hd"><span class="t">ingredients · fig. a–c</span><span class="g">◆</span></div>
        <div class="bd">
          <div class="ing-art" id="ingArt"></div>
          <div class="draw-box" id="drawBox"><div class="ph">впиши ингредиент → нарисую на ходу</div></div>
          <div class="draw-row">
            <input id="drawInput" placeholder="кальмар, лимон, чоризо…" autocomplete="off">
            <button class="chip" onclick="drawIngredient()">draw</button>
          </div>
        </div>
      </div>

      <div class="panel-sec">
        <div class="hd"><span class="t">принципы · axioms</span><span class="g">⊕</span></div>
        <div class="bd"><div id="axioms"></div></div>
      </div>
    </div>

    <!-- steps column -->
    <div class="col-steps">
      <div class="tracks">
        <button class="chip on" data-track="both">⊕ параллель</button>
        <button class="chip" data-track="sea">◆ море</button>
        <button class="chip" data-track="veg">◇ веган</button>
      </div>

      <p style="color:var(--muted);font-size:12px;letter-spacing:.04em;margin:0 2px 4px">
        <span id="metaSub"></span>
      </p>

      <div class="console">
        <div class="hd"><span class="t">chef · console</span>
          <span style="display:flex;gap:6px">
            <button class="chip" onclick="adviseStep()">посоветуй по шагу</button>
            <button class="chip" onclick="checkByCamera()">проверить камерой</button>
          </span>
        </div>
        <div class="bd" id="consoleBd"><span class="ph">подсказки по ходу готовки · openrouter</span></div>
      </div>

      <div id="steps"></div>

      <button class="chip" onclick="resetAll()" style="margin-top:8px">сбросить прогресс</button>
    </div>

  </div>

  <footer class="stamp">
    <div class="seeds" id="seeds"></div>
    <div class="fig" id="stampFig">fig.01</div>
  </footer>

</div>

<div class="dock" id="dock"></div>

<script src="app.js?v=1"></script>
</body>
</html>
